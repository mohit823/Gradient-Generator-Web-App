<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="box">
            <div class="colorText">
                <button id="btn1">#ffffff</button>
                <button id="btn2">#000000</button>
            </div>

            <div class="showColorText">
                <p id="text">
                    Background-image: linear-gradient(to right, #ffffff, #000000)
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
